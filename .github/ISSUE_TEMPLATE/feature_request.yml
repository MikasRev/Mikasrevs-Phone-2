name: Feature request
description: Suggest an improvement to the phone.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would this improve?
      description: Describe the player experience or problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include examples or screenshots if useful.
    validations:
      required: true
